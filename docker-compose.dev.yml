services:
  app-dev:
    image: node:22-alpine
    container_name: nomisalud-front-end-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
