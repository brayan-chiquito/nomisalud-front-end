services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-Nomisalud}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0}
    image: nomisalud-front-end:latest
    container_name: nomisalud-front-end
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
