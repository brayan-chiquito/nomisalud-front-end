sonar.projectKey=brayan-chiquito_nomisalud-front-end
sonar.organization=brayan-chiquito
sonar.projectName=nomisalud-front-end
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/test/setup.ts

# Archivos excluidos del cómputo de cobertura (infraestructura / bootstrapping)
# Deben coincidir con los excluidos en vitest.config.ts → coverage.exclude
sonar.coverage.exclusions=\
  src/main.tsx,\
  src/App.tsx,\
  src/router/**,\
  src/services/http.ts

# Cobertura – generada por vitest en formato lcov
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
